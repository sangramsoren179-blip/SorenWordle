<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width,initial-scale=1.0"
    >
    <title>SorenWordle</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/game.css">
</head>
<body>
    <main>
        <section id="home">
            <h1>SorenWordle</h1>
            <p>A simple word guessing game.</p>
            <button id="play-button" type="button">Play</button>
        </section>
        
        <section id="game" hidden>
            <nav id="game-navbar">
                <button id="home-button" type="button" aria-label="Go back to home">
                    <img src="assets/icons/back-button.svg" alt="">
                </button>
        
                <h2>SorenWordle</h2>
            </nav>
        
            <p>Guess the hidden word!</p>
        
            <div id="game-grid" role="group" aria-label="Word guessing grid"></div>
        
            <p id="game-message" role="status" aria-live="polite"></p>
            
            <div id="keyboard" role="group" aria-label="On-screen keyboard"></div>
            
            <div id="result-popup" class="result-popup" hidden>
                <div
                    class="result-popup__card"
                    role="dialog"
                    aria-modal="true"
                    aria-labelledby="result-title"
                >
                    <h2 id="result-title"></h2>
            
                    <p id="result-message"></p>
            
                    <p id="result-word"></p>
            
                    <div class="result-popup__buttons">
                        <button id="popup-home-button" type="button">
                            Home
                        </button>
            
                        <button id="popup-cancel-button" type="button">
                            Cancel
                        </button>
            
                        <button id="play-again-button" type="button">
                            Play Again
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
    
    <script type="module" src="js/main.js"></script>
</body>
</html>
